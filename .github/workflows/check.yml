name: Check documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: zudo-case-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # The retained fitfix preview was exported with Python 3.12 gzip headers.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:two-way
      - run: pnpm check:two-way
      - run: pnpm check:docs
      - run: pnpm check:printed-5mm
      - run: pnpm test:printed-5mm
      - run: pnpm check:r9
      - run: node --test tests/fitfix-pcb-materials.test.mjs
      - run: pnpm check:fitfix
      - run: pnpm check:fullset
      - run: pnpm test:fullset
      - run: pnpm check:lid-m5
      - run: pnpm check:fit-test-order
      - run: node --test tests/order-map.test.mjs
      - run: pnpm check:r9-ledger
      - run: pnpm check:r9-doc-table
      - run: pnpm test:r9
      - run: node --test tests/preview-links.test.mjs tests/preview-origin-isolation.test.mjs
      - run: pnpm check:tables
      - run: pnpm check:assets
      - run: pnpm test:setup
      - run: pnpm test:ledger
      - run: pnpm check
      - run: pnpm check:wind
      - run: pnpm check:preview-isolation
      - name: Test asset preparation and deployed verification fixtures
        run: node --test tests/prepare-worker-assets.test.mjs tests/verify-deployed-assets.test.mjs
      - run: pnpm build
      - run: pnpm check:built-preview-links
      - run: pnpm check:images
      - run: pnpm prepare:worker-assets
      - run: node --test tests/worker-assets.test.mjs tests/worker-assets-deployment.test.mjs

  cad-regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Anodizing revision checks the pinned original order bytes.
      - uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          version: 0.10.2
      - name: Install locked CAD dependencies
        run: uv sync --locked
        working-directory: engineering/r9-prototype-01
      - name: Regenerate and validate R9 CAD outputs
        run: uv run python build.py --validate
        working-directory: engineering/r9-prototype-01
      - name: Regenerate candidate packages and output manifest
        run: uv run python -m r9.package
        working-directory: engineering/r9-prototype-01
      - name: Test candidate package repeatability
        run: uv run python -m unittest discover -s tests -p test_package.py
        working-directory: engineering/r9-prototype-01
      - name: Check generated outputs are current
        run: git diff --exit-code -- engineering/r9-prototype-01/out public/downloads/candidate public/previews/r9-prototype-01.html
      - name: Fitfix regression tests
        run: uv run --locked --project ../r9-prototype-01 python tests/test_geometry.py
        working-directory: engineering/r9-fitfix-01
      - name: Regenerate fitfix in disposable output and compare body DXFs
        working-directory: engineering/r9-fitfix-01
        run: |
          uv run --locked --project ../r9-prototype-01 python build.py --out "$RUNNER_TEMP/fitfix"
          uv run --locked --project ../r9-prototype-01 python tools/compare_r9_patterns.py --fixed "$RUNNER_TEMP/fitfix/aluminum/body"
      - name: R9-LID-M5-01 regression tests
        run: uv run --locked --project ../r9-prototype-01 python tests/test_m5.py
        working-directory: engineering/r9-lid-m5-01
      - name: Regenerate R9-LID-M5-01 in disposable output and compare every output hash
        working-directory: engineering/r9-lid-m5-01
        run: |
          uv run --locked --project ../r9-prototype-01 python build.py --out "$RUNNER_TEMP/lidm5"
          uv run --locked --project ../r9-prototype-01 python tools/compare_outputs.py --fresh "$RUNNER_TEMP/lidm5"
      - name: Verify anodizing replacement geometry, exports and mutation guards
        run: uv run --locked --project ../r9-prototype-01 python test_revision.py
        working-directory: engineering/r9-anodizing-01
      - name: Verify original/revised preview mesh cache
        run: uv run --locked --project engineering/r9-prototype-01 python engineering/order-map/aluminum_meshes.py --check

      - name: Regenerate fullset twice and verify every exported/package byte
        run: uv run --locked --project engineering/r9-prototype-01 python engineering/r10-fullset-01/tests/regenerate.py
      - name: Verify exported cap margins and fixed-bracket travel scope
        run: uv run --locked --project engineering/r9-prototype-01 python engineering/r10-fullset-01/tests/cap_margins.py --check

  printed-5mm-cad:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          version: 0.10.2
      - name: Build printed P3 from clean locked source
        run: |
          uv sync --locked --project engineering/printed-5mm/p3
          uv run --locked --project engineering/printed-5mm/p3 python engineering/printed-5mm/p3/build.py --out "$RUNNER_TEMP/printed-p3"
      - name: Check generated print inventory and accepted geometry
        run: python3 engineering/printed-5mm/p3/verify.py --out "$RUNNER_TEMP/printed-p3" --published-root .
      - name: Reject invalid print, scene and parameter inputs
        run: python3 engineering/printed-5mm/p3/negative.py --out "$RUNNER_TEMP/printed-p3"
      - name: Install Chromium for the P3 browser regression
        run: uv run --locked --project engineering/printed-5mm/p3 python -m playwright install --with-deps chromium
      - name: Exercise the P3 standalone viewer in Chromium
        run: uv run --locked --project engineering/printed-5mm/p3 python "$RUNNER_TEMP/printed-p3/source/verify_browser.py"
