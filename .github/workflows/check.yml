name: Check documentation

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: zudo-case-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:docs
      - run: pnpm check:tables
      - run: pnpm check:assets
      - run: pnpm test:setup
      - run: pnpm test:ledger
      - run: pnpm check
      - run: pnpm build
