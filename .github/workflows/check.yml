name: Check documentation

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: zudo-case-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:docs
      - run: node --test tests/preview-links.test.mjs
      - run: pnpm check:tables
      - run: pnpm check:assets
      - run: pnpm test:setup
      - run: pnpm test:ledger
      - run: pnpm check
      - name: Test asset preparation and deployed verification fixtures
        run: node --test tests/prepare-worker-assets.test.mjs tests/verify-deployed-assets.test.mjs
      - run: pnpm build
      - run: pnpm check:built-preview-links
      - run: pnpm prepare:worker-assets
      - run: node --test tests/worker-assets.test.mjs tests/worker-assets-deployment.test.mjs
